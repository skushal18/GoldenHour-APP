name: Build GoldenHour APK

# Builds the installable Android APK in GitHub's cloud.
# You do NOT need Android Studio or a local SDK.
#
#   1. Push this folder to a GitHub repository
#   2. Open the "Actions" tab
#   3. Pick "Build GoldenHour APK" → "Run workflow"
#   4. When it turns green, download the "goldenhour-debug-apk" artifact
#   5. Unzip it, copy app-debug.apk to a phone, tap to install

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Unit + functional tests
        run: npm test

  apk:
    name: Assemble debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goldenhour-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
